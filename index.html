<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Motorell Ops</title>
    <!-- Icon home-screen (shortcut) + PWA -->
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#050506" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Motorell" />
    <!-- Tailwind CSS lewat CDN: nggak perlu setup config apa-apa.
         Ini cara tercepat. (Nanti bisa diganti ke build Tailwind beneran
         kalau app-nya udah makin gede.) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Netralkan overlay ekstensi Grammarly biar nggak bikin kotak aneh di input -->
    <style>
      grammarly-extension,
      grammarly-desktop-integration {
        display: none !important;
      }
    </style>
  </head>
  <body data-gramm="false" data-gramm_editor="false">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
